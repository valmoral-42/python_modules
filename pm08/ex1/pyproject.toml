[project]
name = "the-matrix-data-engineering"
version = "0.1.0"
description = "Virtual environments, dependency management, and environment configuration exercises."
authors = [
    { name = "Valentina Morales" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "matplotlib>=3.8,<4.0",
    "python-dotenv>=1.0,<2.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.8.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"